<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>DootDelivery Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f7f5;
  color:#17231d;
}

header{
  background:#16a34a;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

header h1{
  font-size:22px;
}

header p{
  margin-top:5px;
  font-size:13px;
  opacity:.9;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 10px #00000012;
}

h2{
  font-size:20px;
  margin-bottom:15px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  margin-top:8px;
  margin-bottom:12px;
  outline:none;
  font-size:15px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#16a34a;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#16a34a;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.gray{
  background:#e5e7eb;
  color:#17231d;
}

.login{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px #00000015;
}

.login-logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#16a34a;
  margin-bottom:5px;
}

.login-sub{
  text-align:center;
  color:#777;
  margin-bottom:20px;
}

.error{
  color:#dc2626;
  font-size:14px;
  margin-bottom:10px;
}

.dashboard{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:16px;
}

.stat{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 2px 8px #0000000c;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
  color:#16a34a;
}

.product-row,
.order-row{
  border:1px solid #eee;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
}

.product-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product-info{
  flex:1;
}

.product-info b{
  display:block;
  margin-bottom:5px;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.order-status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#dcfce7;
  color:#166534;
  font-size:12px;
  font-weight:bold;
}

.order-details{
  margin-top:10px;
  line-height:24px;
  color:#555;
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.hidden{
  display:none!important;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }

  .product-row{
    flex-direction:column;
    align-items:flex-start;
  }

  .actions{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">

  <div class="login-box">

    <div class="login-logo">
      🛵 DootDelivery
    </div>

    <div class="login-sub">
      Admin Panel
    </div>

    <div id="loginError" class="error"></div>

    <input
      id="email"
      type="email"
      placeholder="Admin Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button
      class="green"
      style="width:100%"
      onclick="adminLogin()"
    >
      Login
    </button>

  </div>

</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

<header>
  <div class="topbar">

    <div>
      <h1>🛵 DootDelivery Admin</h1>
      <p>Manage your local delivery website</p>
    </div>

    <button
      class="gray"
      onclick="adminLogout()"
    >
      Logout
    </button>

  </div>
</header>


<div class="container">

  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      Products
      <b id="productCount">0</b>
    </div>

    <div class="stat">
      Orders
      <b id="orderCount">0</b>
    </div>

    <div class="stat">
      Sales
      <b>₹<span id="salesTotal">0</span></b>
    </div>

  </div>


  <!-- PRODUCTS -->
  <div class="card">

    <div class="topbar">
      <h2>Products</h2>

      <button
        class="green"
        onclick="showAddProduct()"
      >
        + Add Product
      </button>
    </div>

    <div id="productForm" class="hidden">

      <input
        id="productName"
        placeholder="Product Name"
      >

      <input
        id="productPrice"
        type="number"
        placeholder="Price ₹"
      >

      <select id="productCategory">

        <option value="Grocery">
          Grocery
        </option>

        <option value="Fruits & Vegetables">
          Fruits & Vegetables
        </option>

        <option value="Kitchen">
          Kitchen
        </option>

        <option value="Snacks">
          Snacks
        </option>

        <option value="Personal Care">
          Personal Care
        </option>

        <option value="Home">
          Home
        </option>

      </select>

      <input
        id="productIcon"
        placeholder="Emoji e.g. 🛒"
        value="🛒"
      >

      <div class="actions">

        <button
          class="green"
          onclick="addProduct()"
        >
          Save Product
        </button>

        <button
          class="gray"
          onclick="hideProductForm()"
        >
          Cancel
        </button>

      </div>

    </div>

    <br>

    <div id="productsList"></div>

  </div>


  <!-- ORDERS -->
  <div class="card">

    <div class="topbar">

      <h2>Orders</h2>

      <button
        class="gray"
        onclick="loadOrders()"
      >
        🔄 Refresh
      </button>

    </div>

    <div id="ordersList">
      <div class="empty">
        Loading orders...
      </div>
    </div>

  </div>


  <!-- WEBSITE -->
  <div class="card">

    <h2>Website</h2>

    <p style="color:#666;line-height:24px">
      Your customer website is connected to this repository.
      Customers can browse products and place delivery orders.
    </p>

    <br>

    <button
      class="green"
      onclick="openWebsite()"
    >
      🌐 Open Customer Website
    </button>

  </div>

</div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
    "AIzaSyA0cx3zs7ronUP_Nh1dH-ZjVfDGrECMI_g",

  authDomain:
    "doot-delivery.firebaseapp.com",

  projectId:
    "doot-delivery",

  storageBucket:
    "doot-delivery.firebasestorage.app",

  messagingSenderId:
    "771238210735",

  appId:
    "1:771238210735:web:82fc817bd02cdde8ed385a",

  measurementId:
    "G-94ZTPMFMVC"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* LOGIN */

window.adminLogin = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.innerText = "";

  if(!email || !password){

    error.innerText =
      "Please enter email and password.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    error.innerText =
      "Login failed. Please check your email and password.";

  }

};


/* LOGOUT */

window.adminLogout = async function(){

  await signOut(auth);

};


/* AUTH STATE */

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById("loginPage")
      .style.display="none";

    document.getElementById("dashboard")
      .style.display="block";

    loadProducts();

    loadOrders();

  }else{

    document.getElementById("loginPage")
      .style.display="flex";

    document.getElementById("dashboard")
      .style.display="none";

  }

});


/* PRODUCT FORM */

window.showAddProduct = function(){

  document
    .getElementById("productForm")
    .classList.remove("hidden");

};


window.hideProductForm = function(){

  document
    .getElementById("productForm")
    .classList.add("hidden");

};


/* ADD PRODUCT */

window.addProduct = async function(){

  const name =
    document.getElementById("productName")
    .value.trim();

  const price =
    Number(
      document.getElementById("productPrice")
      .value
    );

  const category =
    document.getElementById("productCategory")
    .value;

  const icon =
    document.getElementById("productIcon")
    .value.trim() || "🛒";


  if(!name || !price){

    alert("Please enter product name and price.");

    return;

  }


  try{

    await addDoc(
      collection(db,"products"),
      {
        name:name,
        price:price,
        cat:category,
        icon:icon,
        createdAt:serverTimestamp()
      }
    );


    document.getElementById("productName")
      .value="";

    document.getElementById("productPrice")
      .value="";

    hideProductForm();

    loadProducts();

    alert("Product added successfully.");

  }catch(e){

    alert(
      "Product save failed. Please check Firebase Firestore."
    );

  }

};


/* LOAD PRODUCTS */

async function loadProducts(){

  const box =
    document.getElementById("productsList");

  box.innerHTML =
    '<div class="empty">Loading products...</div>';

  try{

    const snapshot =
      await getDocs(
        collection(db,"products")
      );

    document.getElementById("productCount")
      .innerText=snapshot.size;


    if(snapshot.empty){

      box.innerHTML =
        '<div class="empty">No products added yet.</div>';

      return;

    }


    box.innerHTML="";


    snapshot.forEach((item)=>{

      const p=item.data();

      const row=document.createElement("div");

      row.className="product-row";

      row.innerHTML=`

        <div class="product-info">

          <b>
            ${p.icon || "🛒"} ${p.name}
          </b>

          <span>
            ₹${p.price}
          </span>

          <br>

          <small>
            ${p.cat || "General"}
          </small>

        </div>

        <div class="actions">

          <button
            class="red"
            onclick="deleteProduct('${item.id}')"
          >
            Delete
          </button>

        </div>

      `;

      box.appendChild(row);

    });

  }catch(e){

    box.innerHTML=
      '<div class="empty">Unable to load products.</div>';

  }

}


/* DELETE PRODUCT */

window.deleteProduct = async function(id){

  if(!confirm("Delete this product?")) return;

  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    loadProducts();

  }catch(e){

    alert("Unable to delete product.");

  }

};


/* LOAD ORDERS */

window.loadOrders = async function(){

  const box =
    document.getElementById("ordersList");

  box.innerHTML =
    '<div class="empty">Loading orders...</div>';

  try{

    const snapshot =
      await getDocs(
        collection(db,"orders")
      );


    document.getElementById("orderCount")
      .innerText=snapshot.size;


    let totalSales=0;

    if(snapshot.empty){

      box.innerHTML=
        '<div class="empty">
          No orders yet.
        </div>';

      document.getElementById("salesTotal")
        .innerText="0";

      return;

    }


    box.innerHTML="";


    snapshot.forEach((item)=>{

      const o=item.data();

      const amount=
        Number(o.total || o.amount || 0);

      totalSales += amount;


      const row =
        document.createElement("div");

      row.className="order-row";

      row.innerHTML=`

        <div class="topbar">

          <b>
            🛵 Order
          </b>

          <span class="order-status">
            ${o.status || "New"}
          </span>

        </div>

        <div class="order-details">

          <b>Name:</b>
          ${o.name || "-"}
          <br>

          <b>Mobile:</b>
          ${o.phone || "-"}
          <br>

          <b>Address:</b>
          ${o.address || "-"}
          <br>

          <b>Total:</b>
          ₹${amount}

          <br><br>

          <button
            class="green"
            onclick="markOrderDelivered('${item.id}')"
          >
            ✓ Delivered
          </button>

        </div>

      `;

      box.appendChild(row);

    });


    document.getElementById("salesTotal")
      .innerText=totalSales;


  }catch(e){

    box.innerHTML=
      '<div class="empty">Unable to load orders.</div>';

  }

};


/* MARK ORDER DELIVERED */

window.markOrderDelivered =
async function(id){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:"Delivered",
        deliveredAt:serverTimestamp()
      }
    );

    loadOrders();

  }catch(e){

    alert("Unable to update order.");

  }

};


/* OPEN WEBSITE */

window.openWebsite=function(){

  window.open(
    "index.html",
    "_blank"
  );

};

</script>

</body>
          </html>
