<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DootDelivery Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f6f8;color:#222}
header{background:#ff6b00;color:#fff;padding:15px}
.header{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ddd;border-radius:8px}
button{border:0;border-radius:8px;padding:10px 15px;background:#ff6b00;color:#fff;font-weight:bold}
.logout{background:#fff;color:#ff6b00}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{font-size:25px;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}
.tableWrap{overflow:auto}
.product{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:10px}
.thumb{width:70px;height:70px;object-fit:contain;background:#f3f3f3;border-radius:8px}
.login{max-width:400px;margin:70px auto}
.hidden{display:none}
.order{border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px}
.small{font-size:13px;color:#666}
.danger{background:#d93025}
.green{background:#188038}
.preview{max-width:160px;max-height:160px;display:block;margin:5px 0}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">🛍️ DootDelivery Admin</div>
<button id="logoutBtn" class="logout hidden">Logout</button>
</div>
</header>

<div id="loginBox" class="card login">

<h2>Admin Login</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button id="loginBtn">Login</button>

<p id="loginError" style="color:red"></p>

</div>

<div id="adminPanel" class="container hidden">

<div class="grid">

<div class="card">
<div>Products</div>
<div class="stat" id="productCount">0</div>
</div>

<div class="card">
<div>Orders</div>
<div class="stat" id="orderCount">0</div>
</div>

<div class="card">
<div>Sales</div>
<div class="stat" id="salesTotal">₹0</div>
</div>

</div>

<div class="card">

<h2>📍 Delivery Location</h2>

<p class="small">
Set your shop/store location once. Customer distance will be calculated from this location.
</p>

<label>Shop Latitude</label>
<input id="shopLat" placeholder="Example: 26.1445">

<label>Shop Longitude</label>
<input id="shopLng" placeholder="Example: 91.7362">

<button id="saveLocation">Save Delivery Location</button>

<p id="locationMsg"></p>

</div>

<div class="card">

<h2>➕ Add Product</h2>

<input id="productName" placeholder="Product Name">

<input id="productUnit" placeholder="Unit e.g. 1 KG, 500 GM, 1 PCS">

<input id="productPrice" type="number" placeholder="Selling Price">

<input id="productOld" type="number" placeholder="MRP / Old Price">

<input id="productCategory" placeholder="Category e.g. Grocery">

<input id="productEmoji" placeholder="Emoji e.g. 🥛">

<label>Product Photo</label>

<input id="productImage" type="file" accept="image/*">

<img id="photoPreview" class="preview">

<button id="addProduct">Add Product</button>

<p id="productMsg"></p>

</div>

<div class="card">

<h2>📦 Products</h2>

<div id="productList"></div>

</div>

<div class="card">

<h2>🛒 Orders</h2>

<div id="ordersList">Loading...</div>

</div>

</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
updateDoc,
doc,
setDoc,
getDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA0cx3zs7ronUP_Nh1d-H1d-ZjVfDGrECMI_g",
authDomain:"doot-delivery.firebaseapp.com",
projectId:"doot-delivery",
storageBucket:"doot-delivery.firebasestorage.app",
messagingSenderId:"771238210735",
appId:"1:771238210735:web:82fc817bd02cdde8ed385a",
measurementId:"G-94ZTPMFMVC"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);
const db=getFirestore(app);

const loginBox=document.getElementById("loginBox");
const adminPanel=document.getElementById("adminPanel");
const logoutBtn=document.getElementById("logoutBtn");

document.getElementById("loginBtn").onclick=async()=>{

const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const error=document.getElementById("loginError");

error.textContent="";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(e){

console.error(e);

error.textContent=
"Login failed. Please check email/password.";

}

};

logoutBtn.onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{

if(user){

loginBox.classList.add("hidden");
adminPanel.classList.remove("hidden");
logoutBtn.classList.remove("hidden");

loadProducts();
loadOrders();
loadLocation();

}else{

loginBox.classList.remove("hidden");
adminPanel.classList.add("hidden");
logoutBtn.classList.add("hidden");

}

});

async function loadLocation(){

try{

const snap=await getDoc(
doc(db,"settings","delivery")
);

if(snap.exists()){

const data=snap.data();

document.getElementById("shopLat").value=
data.shopLat||"";

document.getElementById("shopLng").value=
data.shopLng||"";

}

}catch(e){

console.error(e);

}

}

document.getElementById("saveLocation").onclick=async()=>{

const lat=Number(
document.getElementById("shopLat").value
);

const lng=Number(
document.getElementById("shopLng").value
);

const msg=document.getElementById("locationMsg");

if(
!Number.isFinite(lat) ||
!Number.isFinite(lng)
){

msg.style.color="red";
msg.textContent="Please enter valid latitude and longitude.";
return;

}

try{

await setDoc(
doc(db,"settings","delivery"),
{
shopLat:lat,
shopLng:lng,
updatedAt:serverTimestamp()
},
{merge:true}
);

msg.style.color="green";
msg.textContent="✓ Delivery location saved.";

}catch(e){

console.error(e);

msg.style.color="red";
msg.textContent="Unable to save location.";

}

};

let selectedImageData="";

document.getElementById("productImage").addEventListener(
"change",
async e=>{

const file=e.target.files[0];

if(!file)return;

try{

selectedImageData=await compressImage(file);

document.getElementById("photoPreview").src=
selectedImageData;

}catch(err){

alert(err.message);

}

});

function compressImage(file){

return new Promise((resolve,reject)=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const max=650;

let width=img.width;
let height=img.height;

if(width>height){

if(width>max){

height=Math.round(height*max/width);
width=max;

}

}else{

if(height>max){

width=Math.round(width*max/height);
height=max;

}

}

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,width,height);

ctx.drawImage(
img,
0,
0,
width,
height
);

const data=canvas.toDataURL(
"image/jpeg",
0.58
);

if(data.length>900000){

reject(
new Error(
"Image is too large. Please select a smaller photo."
)
);

return;

}

resolve(data);

};

img.onerror=()=>reject(
new Error("Unable to read image.")
);

img.src=e.target.result;

};

reader.onerror=()=>reject(
new Error("Unable to read file.")
);

reader.readAsDataURL(file);

});

}

document.getElementById("addProduct").onclick=async()=>{

const name=document.getElementById("productName").value.trim();
const unit=document.getElementById("productUnit").value.trim();
const price=Number(document.getElementById("productPrice").value);
const old=Number(document.getElementById("productOld").value)||0;
const cat=document.getElementById("productCategory").value.trim()||"Other";
const emoji=document.getElementById("productEmoji").value.trim()||"🛒";

const msg=document.getElementById("productMsg");

if(!name){

msg.style.color="red";
msg.textContent="Enter product name.";
return;

}

if(!Number.isFinite(price)||price<=0){

msg.style.color="red";
msg.textContent="Enter valid selling price.";
return;

}

try{

await addDoc(
collection(db,"products"),
{

name:name,
unit:unit,
price:price,
old:old,
cat:cat,
emoji:emoji,
imageData:selectedImageData||"",
active:true,
createdAt:serverTimestamp()

}
);

msg.style.color="green";
msg.textContent="✓ Product added successfully.";

document.getElementById("productName").value="";
document.getElementById("productUnit").value="";
document.getElementById("productPrice").value="";
document.getElementById("productOld").value="";
document.getElementById("productCategory").value="";
document.getElementById("productEmoji").value="";
document.getElementById("productImage").value="";
document.getElementById("photoPreview").src="";
selectedImageData="";

loadProducts();

}catch(e){

console.error(e);

msg.style.color="red";
msg.textContent="Unable to add product.";

}

};

async function loadProducts(){

const list=document.getElementById("productList");

list.innerHTML="Loading...";

try{

const snap=await getDocs(
collection(db,"products")
);

const products=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

document.getElementById("productCount").textContent=
products.length;

list.innerHTML="";

if(!products.length){

list.innerHTML="<p>No products added.</p>";
return;

}

products.forEach(p=>{

const div=document.createElement("div");
div.className="product";

if(p.imageData){

const img=document.createElement("img");

img.className="thumb";
img.src=p.imageData;

div.appendChild(img);

}else{

const emoji=document.createElement("div");

emoji.className="thumb";
emoji.style.display="flex";
emoji.style.alignItems="center";
emoji.style.justifyContent="center";
emoji.style.fontSize="35px";
emoji.textContent=p.emoji||"🛒";

div.appendChild(emoji);

}

const info=document.createElement("div");

info.style.flex="1";

info.innerHTML=`
<b>${escapeHtml(p.name)}</b><br>
<span class="small">
${escapeHtml(p.unit||"")} |
₹${Number(p.price||0)} |
${escapeHtml(p.cat||"Other")}
</span>
`;

const del=document.createElement("button");

del.className="danger";
del.textContent="Delete";

del.onclick=async()=>{

if(!confirm("Delete this product?"))return;

await deleteDoc(
doc(db,"products",p.id)
);

loadProducts();

};

div.appendChild(info);
div.appendChild(del);

list.appendChild(div);

});

}catch(e){

console.error(e);

list.innerHTML="Unable to load products.";

}

}

async function loadOrders(){

const list=document.getElementById("ordersList");

list.innerHTML="Loading...";

try{

const snap=await getDocs(
collection(db,"orders")
);

const orders=snap.docs.map(d=>({
id:d.id,
...d.data()
}));

orders.sort((a,b)=>{

const ta=a.createdAt?.seconds||0;
const tb=b.createdAt?.seconds||0;

return tb-ta;

});

document.getElementById("orderCount").textContent=
orders.length;

let sales=0;

orders.forEach(o=>{

sales+=Number(o.total||0);

});

document.getElementById("salesTotal").textContent=
"₹"+sales;

list.innerHTML="";

if(!orders.length){

list.innerHTML="<p>No orders yet.</p>";
return;

}

orders.forEach(o=>{

const div=document.createElement("div");

div.className="order";

let items="";

(o.items||[]).forEach(item=>{

items+=`
<div>
${escapeHtml(item.name)}
 × ${item.qty}
 = ₹${Number(item.amount||0)}
</div>
`;

});

const statusOptions=[
"Pending",
"Confirmed",
"Preparing",
"Out for Delivery",
"Delivered",
"Cancelled"
];

const select=document.createElement("select");

statusOptions.forEach(status=>{

const option=document.createElement("option");

option.value=status;
option.textContent=status;

if(status===(o.status||"Pending")){

option.selected=true;

}

select.appendChild(option);

});

select.onchange=async()=>{

await updateDoc(
doc(db,"orders",o.id),
{
status:select.value,
updatedAt:serverTimestamp()
}
);

};

const title=document.createElement("h3");

title.textContent=
"Order #"+o.id.substring(0,8);

div.appendChild(title);

const customer=document.createElement("div");

customer.innerHTML=`
<b>Customer:</b> ${escapeHtml(o.customerName||"")}<br>
<b>Phone:</b> ${escapeHtml(o.phone||"")}<br>
<b>Address:</b> ${escapeHtml(o.address||"")}<br>
<b>Distance:</b> ${o.deliveryDistanceKm||"-"} km<br><br>

<b>Items:</b><br>
${items}

<br>
<b>Subtotal:</b> ₹${Number(o.subtotal||0)}<br>
<b>Delivery:</b> ₹${Number(o.deliveryCharge||0)}<br>
<b>Total:</b> ₹${Number(o.total||0)}
`;

div.appendChild(customer);

const label=document.createElement("p");

label.innerHTML="<b>Status:</b>";

div.appendChild(label);
div.appendChild(select);

list.appendChild(div);

});

}catch(e){

console.error(e);

list.innerHTML="Unable to load orders.";

}

}

function escapeHtml(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>
 </html>
