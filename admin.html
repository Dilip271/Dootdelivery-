<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>DootDelivery Admin</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f7f5;color:#17231d}
button,input,select,textarea{font:inherit}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer}
header{background:#16a34a;color:white;padding:18px;position:sticky;top:0;z-index:10}
.container{max-width:1100px;margin:auto;padding:18px}
.card{background:white;border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px #00000012}
.login{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-box{width:100%;max-width:420px;background:white;padding:28px;border-radius:20px;box-shadow:0 5px 30px #00000015}
.login-logo{text-align:center;font-size:29px;font-weight:bold;color:#16a34a;margin-bottom:5px}
.login-sub{text-align:center;color:#777;margin-bottom:22px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:7px;margin-bottom:12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#16a34a}
.green{background:#16a34a;color:white}
.red{background:#dc2626;color:white}
.gray{background:#e5e7eb;color:#17231d}
.error{color:#dc2626;font-size:14px;margin-bottom:10px}
.dashboard{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 8px #0000000c}
.stat b{display:block;font-size:26px;margin-top:6px;color:#16a34a}
.product-row,.order-row{border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:10px}
.product-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.product-info{flex:1;line-height:23px}
.product-info b{display:block;font-size:16px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.order-status{display:inline-block;padding:5px 9px;border-radius:20px;background:#dcfce7;color:#166534;font-size:12px;font-weight:bold}
.order-details{margin-top:10px;line-height:24px;color:#555}
.empty{text-align:center;padding:25px;color:#777}
.hidden{display:none!important}

.photo-preview{
display:none;
width:120px;
height:120px;
object-fit:contain;
background:#eff7f1;
border-radius:12px;
border:1px solid #ddd;
margin:5px 0 12px;
}

.product-thumb{
width:60px;
height:60px;
object-fit:contain;
border-radius:10px;
background:#eff7f1;
vertical-align:middle;
margin-right:8px;
}

@media(max-width:600px){
.stats{grid-template-columns:1fr}
.product-row{flex-direction:column;align-items:flex-start}
.actions{width:100%}
.actions button{flex:1}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">

<div class="login-box">

<div class="login-logo">
🛵 DootDelivery
</div>

<div class="login-sub">
Admin Panel
</div>

<div id="loginError" class="error"></div>

<input
id="email"
type="email"
placeholder="Admin Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button
class="green"
style="width:100%"
onclick="adminLogin()"
>
Login
</button>

</div>
</div>


<!-- DASHBOARD -->
<div id="dashboard" class="dashboard">

<header>

<div class="topbar">

<div>
<h1>🛵 DootDelivery Admin</h1>

<p style="margin-top:5px">
Manage your local delivery website
</p>
</div>

<button
class="gray"
onclick="adminLogout()"
>
Logout
</button>

</div>

</header>


<div class="container">

<!-- STATS -->

<div class="stats">

<div class="stat">
Products
<b id="productCount">0</b>
</div>

<div class="stat">
Orders
<b id="orderCount">0</b>
</div>

<div class="stat">
Sales
<b>₹<span id="salesTotal">0</span></b>
</div>

</div>


<!-- PRODUCTS -->

<div class="card">

<div class="topbar">

<h2>Products</h2>

<button
class="green"
onclick="showAddProduct()"
>
+ Add Product
</button>

</div>


<div id="productForm" class="hidden">

<input
id="productName"
placeholder="Product Name"
>

<input
id="productUnit"
placeholder="Unit e.g. 1 kg / 1 L / 500 g"
>

<input
id="productPrice"
type="number"
placeholder="Selling Price ₹"
>

<input
id="productOldPrice"
type="number"
placeholder="MRP / Old Price ₹"
>

<select id="productCategory">

<option value="Grocery">Grocery</option>
<option value="Fruits & Vegetables">Fruits & Vegetables</option>
<option value="Dairy">Dairy</option>
<option value="Cooking">Cooking</option>
<option value="Snacks">Snacks</option>
<option value="Beverages">Beverages</option>
<option value="Drinks">Drinks</option>
<option value="Household">Household</option>
<option value="Personal Care">Personal Care</option>
<option value="Kitchen">Kitchen</option>
<option value="Home">Home</option>

</select>


<input
id="productEmoji"
placeholder="Emoji fallback e.g. 🛒"
value="🛒"
>


<label>
<b>Product Photo</b>
</label>

<input
id="productImage"
type="file"
accept="image/*"
onchange="previewProductImage(event)"
>

<img
id="photoPreview"
class="photo-preview"
alt="Product Photo Preview"
>


<div class="actions">

<button
class="green"
onclick="addProduct()"
>
Save Product
</button>

<button
class="gray"
onclick="hideProductForm()"
>
Cancel
</button>

</div>

</div>

<br>

<div id="productsList">
<div class="empty">
Loading products...
</div>
</div>

</div>


<!-- ORDERS -->

<div class="card">

<div class="topbar">

<h2>Orders</h2>

<button
class="gray"
onclick="loadOrders()"
>
🔄 Refresh
</button>

</div>

<div id="ordersList">
<div class="empty">
Loading orders...
</div>
</div>

</div>


<!-- WEBSITE -->

<div class="card">

<h2>🌐 Customer Website</h2>

<p style="color:#666;line-height:24px;margin:10px 0 15px">
Open the DootDelivery customer website.
</p>

<button
class="green"
onclick="openWebsite()"
>
Open Customer Website →
</button>

</div>

</div>
</div>


<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey:"AIzaSyA0cx3zs7ronUP_Nh1d-H1d-ZjVfDGrECMI_g",

authDomain:"doot-delivery.firebaseapp.com",

projectId:"doot-delivery",

storageBucket:"doot-delivery.firebasestorage.app",

messagingSenderId:"771238210735",

appId:"1:771238210735:web:82fc817bd02cdde8ed385a",

measurementId:"G-94ZTPMFMVC"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* LOGIN */

window.adminLogin = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const error =
document.getElementById("loginError");

error.innerText = "";

if(!email || !password){

error.innerText =
"Please enter email and password.";

return;

}

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(e){

console.error(e);

error.innerText =
"Login failed. Please check your email and password.";

}

};


/* LOGOUT */

window.adminLogout = async function(){

await signOut(auth);

};


/* AUTH */

onAuthStateChanged(auth,(user)=>{

if(user){

document.getElementById("loginPage").style.display="none";

document.getElementById("dashboard").style.display="block";

loadProducts();

loadOrders();

}else{

document.getElementById("loginPage").style.display="flex";

document.getElementById("dashboard").style.display="none";

}

});


/* PRODUCT FORM */

window.showAddProduct = function(){

document
.getElementById("productForm")
.classList
.remove("hidden");

};


window.hideProductForm = function(){

document
.getElementById("productForm")
.classList
.add("hidden");

clearProductForm();

};


function clearProductForm(){

document.getElementById("productName").value="";

document.getElementById("productUnit").value="";

document.getElementById("productPrice").value="";

document.getElementById("productOldPrice").value="";

document.getElementById("productEmoji").value="🛒";

document.getElementById("productImage").value="";

document.getElementById("photoPreview").src="";

document.getElementById("photoPreview").style.display="none";

}


/* PHOTO PREVIEW */

window.previewProductImage = function(event){

const file =
event.target.files[0];

const preview =
document.getElementById("photoPreview");

if(!file){

preview.style.display="none";

return;

}

if(!file.type.startsWith("image/")){

alert("Please select an image.");

event.target.value="";

return;

}

if(file.size > 10 * 1024 * 1024){

alert("Please select an image below 10 MB.");

event.target.value="";

return;

}

const reader =
new FileReader();

reader.onload=function(e){

preview.src=e.target.result;

preview.style.display="block";

};

reader.readAsDataURL(file);

};


/* COMPRESS PHOTO */

function compressImage(file){

return new Promise((resolve,reject)=>{

const reader =
new FileReader();

reader.onload=function(e){

const img =
new Image();

img.onload=function(){

const maxSize=650;

let width=img.width;

let height=img.height;

if(width>maxSize || height>maxSize){

const ratio =
Math.min(
maxSize/width,
maxSize/height
);

width =
Math.round(width*ratio);

height =
Math.round(height*ratio);

}

const canvas =
document.createElement("canvas");

canvas.width=width;

canvas.height=height;

const ctx =
canvas.getContext("2d");

ctx.fillStyle="#ffffff";

ctx.fillRect(
0,
0,
width,
height
);

ctx.drawImage(
img,
0,
0,
width,
height
);

const data =
canvas.toDataURL(
"image/jpeg",
0.58
);

resolve(data);

};

img.onerror=reject;

img.src=e.target.result;

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}


/* ADD PRODUCT */

window.addProduct = async function(){

const name =
document.getElementById("productName")
.value.trim();

const unit =
document.getElementById("productUnit")
.value.trim();

const price =
Number(
document.getElementById("productPrice")
.value
);

const old =
Number(
document.getElementById("productOldPrice")
.value
);

const cat =
document.getElementById("productCategory")
.value;

const emoji =
document.getElementById("productEmoji")
.value.trim() || "🛒";

const file =
document.getElementById("productImage")
.files[0];


if(!name || !price){

alert(
"Please enter product name and price."
);

return;

}


try{

let imageData="";

if(file){

imageData =
await compressImage(file);

}


/*
Firestore document size limit is about 1 MB.
Keep compressed image below this limit.
*/

if(imageData.length > 900000){

alert(
"Photo is still too large. Please choose a smaller photo."
);

return;

}


await addDoc(
collection(db,"products"),
{

name:name,

cat:cat,

unit:unit || "1 pc",

price:price,

old:old || price,

emoji:emoji,

imageData:imageData,

active:true,

createdAt:serverTimestamp()

}
);


hideProductForm();

await loadProducts();

alert(
"Product added successfully."
);


}catch(e){

console.error(e);

alert(
"Product save failed. Please check Firestore rules or choose a smaller photo."
);

}

};


/* LOAD PRODUCTS */

async function loadProducts(){

const box =
document.getElementById("productsList");

box.innerHTML =
'<div class="empty">Loading products...</div>';


try{

const snapshot =
await getDocs(
collection(db,"products")
);


document
.getElementById("productCount")
.innerText =
snapshot.size;


if(snapshot.empty){

box.innerHTML =
'<div class="empty">No products added yet.</div>';

return;

}


box.innerHTML="";


snapshot.forEach((item)=>{

const p=item.data();

const row =
document.createElement("div");

row.className="product-row";


const photo =
p.imageData
?
`<img class="product-thumb" src="${p.imageData}" alt="">`
:
"";


row.innerHTML = `

<div class="product-info">

<b>
${photo}
${escapeHTML(p.emoji || "🛒")}
${escapeHTML(p.name || "Product")}
</b>

₹${p.price || 0}

${
p.old && p.old > p.price
?
` <del style="color:#999">
₹${p.old}
</del>`
:
""
}

<br>

<small>
${escapeHTML(p.cat || "General")}
 •
${escapeHTML(p.unit || "1 pc")}
</small>

</div>

<div class="actions">

<button
class="red"
onclick="deleteProduct('${item.id}')"
>
Delete
</button>

</div>

`;

box.appendChild(row);

});

}catch(e){

console.error(e);

box.innerHTML =
'<div class="empty">
Unable to load products.
</div>';

}

}


/* DELETE PRODUCT */

window.deleteProduct = async function(id){

if(!confirm(
"Delete this product?"
)) return;


try{

await deleteDoc(
doc(db,"products",id)
);

await loadProducts();

}catch(e){

alert(
"Unable to delete product."
);

}

};


/* LOAD ORDERS */

window.loadOrders = async function(){

const box =
document.getElementById("ordersList");

box.innerHTML =
'<div class="empty">
Loading orders...
</div>';


try{

const snapshot =
await getDocs(
collection(db,"orders")
);


document
.getElementById("orderCount")
.innerText =
snapshot.size;


let sales=0;


snapshot.forEach((item)=>{

const o=item.data();

if(
o.status!=="Cancelled" &&
o.status!=="Canceled"
){

sales += Number(
o.total ||
o.amount ||
0
);

}

});


document
.getElementById("salesTotal")
.innerText =
Math.round(sales);


if(snapshot.empty){

box.innerHTML =
'<div class="empty">
No orders yet.
</div>';

return;

}


box.innerHTML="";


snapshot.forEach((item)=>{

const o=item.data();

const row =
document.createElement("div");

row.className="order-row";

const status =
o.status || "Pending";


row.innerHTML = `

<div class="topbar">

<div>

<b>
Order #${item.id.substring(0,8)}
</b>

<br>

<span class="order-status">
${escapeHTML(status)}
</span>

</div>


<select
onchange="changeOrderStatus('${item.id}',this.value)"
style="width:auto;margin:0"
>

<option ${status==="Pending"?"selected":""}>
Pending
</option>

<option ${status==="Confirmed"?"selected":""}>
Confirmed
</option>

<option ${status==="Preparing"?"selected":""}>
Preparing
</option>

<option ${status==="Out for Delivery"?"selected":""}>
Out for Delivery
</option>

<option ${status==="Delivered"?"selected":""}>
Delivered
</option>

<option ${status==="Cancelled"?"selected":""}>
Cancelled
</option>

</select>

</div>


<div class="order-details">

<b>Customer:</b>
${escapeHTML(
o.customerName ||
o.name ||
"Customer"
)}

<br>

<b>Phone:</b>
${escapeHTML(
o.phone ||
"Not provided"
)}

<br>

<b>Address:</b>
${escapeHTML(
o.address ||
"Not provided"
)}

<br>

<b>Total:</b>
₹${o.total || o.amount || 0}

<br>

<b>Payment:</b>
${escapeHTML(
o.paymentMethod ||
o.payment ||
"COD"
)}

<br>

<b>Items:</b>
${formatItems(o.items)}

</div>

`;

box.appendChild(row);

});

}catch(e){

console.error(e);

box.innerHTML =
'<div class="empty">
Unable to load orders.
</div>';

}

};


/* CHANGE STATUS */

window.changeOrderStatus =
async function(id,status){

try{

await updateDoc(
doc(db,"orders",id),
{
status:status,
updatedAt:serverTimestamp()
}
);

await loadOrders();

}catch(e){

console.error(e);

alert(
"Unable to update order."
);

}

};


/* WEBSITE */

window.openWebsite=function(){

window.open(
"index.html",
"_blank"
);

};


/* HTML SAFE */

function escapeHTML(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* FORMAT ITEMS */

function formatItems(items){

if(!items) return "—";

if(Array.isArray(items)){

return items.map(x=>{

if(typeof x==="string")
return escapeHTML(x);

return escapeHTML(
x.name ||
x.title ||
"Item"
)
+
" × "
+
(
x.qty ||
x.quantity ||
1
);

}).join(", ");

}

if(typeof items==="object"){

return Object.values(items)
.map(x=>{

if(typeof x==="string")
return escapeHTML(x);

return escapeHTML(
x.name ||
x.title ||
"Item"
)
+
" × "
+
(
x.qty ||
x.quantity ||
1
);

}).join(", ");

}

return escapeHTML(items);

}

</script>

</body>
                           </html>
