<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DootDelivery</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#222}
header{background:#ff6b00;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:20}
.header{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:25px;font-weight:800}
.cartBtn{border:0;background:#fff;color:#ff6b00;padding:10px 14px;border-radius:10px;font-weight:bold}
.container{max-width:1100px;margin:auto;padding:15px}
.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:12px}
.categories{display:flex;gap:8px;overflow-x:auto;margin-bottom:15px}
.catBtn{border:0;padding:9px 14px;border-radius:20px;background:#fff;white-space:nowrap}
.catBtn.active{background:#ff6b00;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px #00000012}
.photo{width:100%;height:150px;object-fit:contain;border-radius:10px;background:#f5f5f5}
.emoji{height:150px;display:flex;align-items:center;justify-content:center;font-size:70px;background:#f5f5f5;border-radius:10px}
.name{font-weight:bold;margin-top:9px}
.unit{font-size:13px;color:#777;margin:4px 0}
.price{font-size:19px;font-weight:bold}
.old{text-decoration:line-through;color:#999;font-size:13px;margin-left:5px}
.add{width:100%;margin-top:8px;border:0;background:#ff6b00;color:white;padding:10px;border-radius:9px;font-weight:bold}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.qty button{width:34px;height:34px;border:0;border-radius:8px;background:#ff6b00;color:#fff;font-size:20px}
.empty{text-align:center;padding:40px;color:#777}

.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;overflow:auto}
.modalBox{background:#fff;width:min(600px,94%);margin:30px auto;padding:18px;border-radius:16px}
.close{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px}
.cartItem{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:12px 0}
.form input,.form textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
.form textarea{min-height:80px}
.summary{background:#f7f7f7;padding:12px;border-radius:10px;margin-top:12px}
.row{display:flex;justify-content:space-between;margin:8px 0}
.total{font-size:20px;font-weight:bold;border-top:1px solid #ddd;padding-top:10px}
.locationBtn{width:100%;padding:12px;border:1px solid #ff6b00;background:#fff;color:#ff6b00;border-radius:9px;font-weight:bold;margin-top:6px}
.orderBtn{width:100%;padding:14px;background:#25d366;color:#fff;border:0;border-radius:10px;font-size:17px;font-weight:bold;margin-top:12px}
.distanceInfo{font-size:13px;margin-top:8px}
.error{color:#d00}
.success{color:green}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">🛍️ DootDelivery</div>
<button class="cartBtn" id="openCart">🛒 Cart <span id="cartCount">0</span></button>
</div>
</header>

<div class="container">

<input class="search" id="search" placeholder="Search products...">

<div class="categories" id="categories"></div>

<div class="products" id="products"></div>

</div>

<div class="modal" id="cartModal">
<div class="modalBox">

<button class="close" id="closeCart">×</button>
<h2>🛒 Your Cart</h2>

<div id="cartItems"></div>

<div class="summary">
<div class="row">
<span>Subtotal</span>
<b id="subtotal">₹0</b>
</div>

<div class="row">
<span>Delivery</span>
<b id="deliveryCharge">₹0</b>
</div>

<div class="row total">
<span>Total</span>
<b id="grandTotal">₹0</b>
</div>

<div id="distanceInfo" class="distanceInfo"></div>
</div>

<div class="form">

<h3>Delivery Details</h3>

<input id="customerName" placeholder="Your Name">

<input id="customerPhone" type="tel" placeholder="Mobile Number">

<textarea id="customerAddress" placeholder="Complete Delivery Address"></textarea>

<button class="locationBtn" id="locationBtn">
📍 Use My Current Location
</button>

<div id="locationStatus" class="distanceInfo"></div>

</div>

<button class="orderBtn" id="orderBtn">
Order on WhatsApp
</button>

</div>
</div>

<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs,
addDoc,
serverTimestamp,
doc,
getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyA0cx3zs7ronUP_Nh1d-H1d-ZjVfDGrECMI_g",
authDomain:"doot-delivery.firebaseapp.com",
projectId:"doot-delivery",
storageBucket:"doot-delivery.firebasestorage.app",
messagingSenderId:"771238210735",
appId:"1:771238210735:web:82fc817bd02cdde8ed385a",
measurementId:"G-94ZTPMFMVC"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

const WHATSAPP="919678274671";

let products=[];
let cart=[];
let selectedCategory="All";

let customerLat=null;
let customerLng=null;
let shopLat=null;
let shopLng=null;

const productsEl=document.getElementById("products");
const categoriesEl=document.getElementById("categories");
const searchEl=document.getElementById("search");

async function loadShopLocation(){

try{

const snap=await getDoc(doc(db,"settings","delivery"));

if(snap.exists()){

const d=snap.data();

shopLat=Number(d.shopLat);
shopLng=Number(d.shopLng);

}

}catch(e){

console.log("Shop location error",e);

}

}

async function loadProducts(){

productsEl.innerHTML='<div class="empty">Loading products...</div>';

try{

const snap=await getDocs(collection(db,"products"));

products=snap.docs
.map(d=>({
id:d.id,
...d.data()
}))
.filter(p=>p.active!==false);

renderCategories();
renderProducts();

}catch(e){

console.error(e);

productsEl.innerHTML='<div class="empty">Unable to load products.</div>';

}

}

function renderCategories(){

const cats=["All",...new Set(products.map(p=>p.cat||"Other"))];

categoriesEl.innerHTML="";

cats.forEach(cat=>{

const btn=document.createElement("button");

btn.className="catBtn "+(cat===selectedCategory?"active":"");

btn.textContent=cat;

btn.onclick=()=>{

selectedCategory=cat;
renderCategories();
renderProducts();

};

categoriesEl.appendChild(btn);

});

}

function renderProducts(){

const search=searchEl.value.toLowerCase().trim();

const list=products.filter(p=>{

const matchCat=
selectedCategory==="All" ||
(p.cat||"Other")===selectedCategory;

const matchSearch=
!search ||
(p.name||"").toLowerCase().includes(search) ||
(p.cat||"").toLowerCase().includes(search);

return matchCat&&matchSearch;

});

productsEl.innerHTML="";

if(!list.length){

productsEl.innerHTML='<div class="empty">No products found.</div>';

return;

}

list.forEach(p=>{

const card=document.createElement("div");
card.className="card";

if(p.imageData){

const img=document.createElement("img");
img.className="photo";
img.src=p.imageData;
img.alt=p.name||"Product";
card.appendChild(img);

}else{

const emoji=document.createElement("div");
emoji.className="emoji";
emoji.textContent=p.emoji||"🛒";
card.appendChild(emoji);

}

const name=document.createElement("div");
name.className="name";
name.textContent=p.name||"Product";

const unit=document.createElement("div");
unit.className="unit";
unit.textContent=p.unit||"";

const price=document.createElement("span");
price.className="price";
price.textContent="₹"+Number(p.price||0);

card.appendChild(name);
card.appendChild(unit);
card.appendChild(price);

if(Number(p.old)>Number(p.price)){

const old=document.createElement("span");
old.className="old";
old.textContent="₹"+Number(p.old);
card.appendChild(old);

}

const existing=cart.find(x=>x.id===p.id);

if(existing){

const qty=document.createElement("div");
qty.className="qty";

const minus=document.createElement("button");
minus.textContent="−";

const count=document.createElement("b");
count.textContent=existing.qty;

const plus=document.createElement("button");
plus.textContent="+";

minus.onclick=()=>{
changeQty(p.id,-1);
};

plus.onclick=()=>{
changeQty(p.id,1);
};

qty.append(minus,count,plus);
card.appendChild(qty);

}else{

const add=document.createElement("button");
add.className="add";
add.textContent="+ Add";

add.onclick=()=>{
addToCart(p.id);
};

card.appendChild(add);

}

productsEl.appendChild(card);

});

}

function addToCart(id){

const p=products.find(x=>x.id===id);

if(!p)return;

const existing=cart.find(x=>x.id===id);

if(existing){

existing.qty++;

}else{

cart.push({
id:p.id,
name:p.name||"Product",
price:Number(p.price)||0,
unit:p.unit||"",
qty:1
});

}

renderProducts();
renderCart();

}

function changeQty(id,change){

const item=cart.find(x=>x.id===id);

if(!item)return;

item.qty+=change;

if(item.qty<=0){

cart=cart.filter(x=>x.id!==id);

}

renderProducts();
renderCart();

}

function getSubtotal(){

return cart.reduce(
(sum,item)=>sum+(item.price*item.qty),
0
);

}

/*
DISTANCE DELIVERY RULE

0–2 km = ₹30
>2–4 km = ₹40
>4–6 km = ₹50
>6 km = unavailable
*/

function getDistanceKm(){

if(
customerLat===null ||
customerLng===null ||
shopLat===null ||
shopLng===null
){

return null;

}

const R=6371;

const dLat=(customerLat-shopLat)*Math.PI/180;
const dLng=(customerLng-shopLng)*Math.PI/180;

const a=
Math.sin(dLat/2)**2+
Math.cos(shopLat*Math.PI/180)*
Math.cos(customerLat*Math.PI/180)*
Math.sin(dLng/2)**2;

const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

function getDeliveryCharge(){

const km=getDistanceKm();

if(km===null)return null;

if(km<=2)return 30;

if(km<=4)return 40;

if(km<=6)return 50;

return -1;

}

function renderCart(){

const cartItems=document.getElementById("cartItems");

cartItems.innerHTML="";

let count=0;

cart.forEach(item=>{

count+=item.qty;

const div=document.createElement("div");
div.className="cartItem";

div.innerHTML=`
<div>
<b>${escapeHtml(item.name)}</b>
<div style="font-size:13px;color:#777">
${item.unit||""}
</div>
</div>

<div style="text-align:right">
<b>₹${item.price*item.qty}</b>
<div style="margin-top:5px">
<button onclick="window.cartChange('${item.id}',-1)">−</button>
<b style="margin:0 8px">${item.qty}</b>
<button onclick="window.cartChange('${item.id}',1)">+</button>
</div>
</div>
`;

cartItems.appendChild(div);

});

document.getElementById("cartCount").textContent=count;

const subtotal=getSubtotal();

document.getElementById("subtotal").textContent="₹"+subtotal;

const charge=getDeliveryCharge();

if(charge===null){

document.getElementById("deliveryCharge").textContent="Select location";

document.getElementById("grandTotal").textContent="₹"+subtotal;

document.getElementById("distanceInfo").innerHTML=
"📍 Please use your current location to calculate delivery charge.";

}else if(charge===-1){

document.getElementById("deliveryCharge").textContent="Unavailable";

document.getElementById("grandTotal").textContent="—";

document.getElementById("distanceInfo").innerHTML=
'<span class="error">❌ Delivery is available only within 6 km.</span>';

}else{

document.getElementById("deliveryCharge").textContent="₹"+charge;

document.getElementById("grandTotal").textContent=
"₹"+(subtotal+charge);

const km=getDistanceKm();

document.getElementById("distanceInfo").innerHTML=
`📍 Delivery distance: <b>${km.toFixed(2)} km</b>`;

}

}

window.cartChange=function(id,change){

changeQty(id,change);

};

function escapeHtml(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

searchEl.addEventListener("input",renderProducts);

document.getElementById("openCart").onclick=()=>{

document.getElementById("cartModal").style.display="block";
renderCart();

};

document.getElementById("closeCart").onclick=()=>{

document.getElementById("cartModal").style.display="none";

};

window.onclick=e=>{

if(e.target===document.getElementById("cartModal")){

document.getElementById("cartModal").style.display="none";

}

};

document.getElementById("locationBtn").onclick=()=>{

const status=document.getElementById("locationStatus");

if(!navigator.geolocation){

status.innerHTML='<span class="error">Location not supported.</span>';
return;

}

status.textContent="Getting your location...";

navigator.geolocation.getCurrentPosition(

position=>{

customerLat=position.coords.latitude;
customerLng=position.coords.longitude;

const km=getDistanceKm();

if(km===null){

status.textContent="Location received.";

}else if(km>6){

status.innerHTML=
`<span class="error">❌ You are ${km.toFixed(2)} km away. Delivery available only within 6 km.</span>`;

}else{

status.innerHTML=
`<span class="success">✓ Location confirmed — ${km.toFixed(2)} km</span>`;

}

renderCart();

},

error=>{

status.innerHTML=
'<span class="error">Please allow location access to calculate delivery charge.</span>';

},

{
enableHighAccuracy:true,
timeout:15000,
maximumAge:0
}

);

};

document.getElementById("orderBtn").onclick=async()=>{

if(!cart.length){

alert("Please add products to cart.");
return;

}

const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("customerPhone").value.trim();
const address=document.getElementById("customerAddress").value.trim();

if(!name){

alert("Please enter your name.");
return;

}

if(!phone || phone.length<10){

alert("Please enter a valid mobile number.");
return;

}

if(!address){

alert("Please enter delivery address.");
return;

}

if(customerLat===null || customerLng===null){

alert("Please use your current location first.");
return;

}

if(shopLat===null || shopLng===null){

alert("Delivery location is not configured yet.");
return;

}

const km=getDistanceKm();

if(km>6){

alert(
"Sorry, delivery is available only within 6 km. Your distance is "+
km.toFixed(2)+" km."
);

return;

}

const deliveryCharge=getDeliveryCharge();

const subtotal=getSubtotal();

const total=subtotal+deliveryCharge;

const orderItems=cart.map(item=>({
id:item.id,
name:item.name,
unit:item.unit,
price:item.price,
qty:item.qty,
amount:item.price*item.qty
}));

const button=document.getElementById("orderBtn");

button.disabled=true;
button.textContent="Saving Order...";

try{

const orderRef=await addDoc(collection(db,"orders"),{

customerName:name,
phone:phone,
address:address,

customerLat:customerLat,
customerLng:customerLng,

deliveryDistanceKm:Number(km.toFixed(2)),

items:orderItems,

subtotal:subtotal,
deliveryCharge:deliveryCharge,
total:total,

paymentMethod:"WhatsApp / COD",
status:"Pending",

createdAt:serverTimestamp()

});

let message=
`*🛍️ DOOT DELIVERY ORDER*%0A%0A`+
`*Order ID:* ${orderRef.id}%0A`+
`*Customer:* ${encodeURIComponent(name)}%0A`+
`*Mobile:* ${encodeURIComponent(phone)}%0A`+
`*Address:* ${encodeURIComponent(address)}%0A%0A`+
`*ITEMS:*%0A`;

orderItems.forEach(item=>{

message+=
`• ${encodeURIComponent(item.name)} x ${item.qty} = ₹${item.amount}%0A`;

});

message+=
`%0A*Subtotal:* ₹${subtotal}%0A`+
`*Delivery (${km.toFixed(2)} km):* ₹${deliveryCharge}%0A`+
`*TOTAL:* ₹${total}%0A%0A`+
`Payment: COD / WhatsApp`;

cart=[];

renderProducts();
renderCart();

document.getElementById("cartModal").style.display="none";

window.open(
"https://wa.me/"+WHATSAPP+"?text="+message,
"_blank"
);

}catch(error){

console.error(error);

alert(
"Order save nahi ho saka. Please try again."
);

}finally{

button.disabled=false;
button.textContent="Order on WhatsApp";

}

};

await loadShopLocation();
await loadProducts();

</script>

</body>
</html>
