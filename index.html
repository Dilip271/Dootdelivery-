<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16a34a">
<title>Doot Delivery - Fast Local Delivery</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f6;
  color:#17231d;
  padding-bottom:90px;
}

/* HEADER */
header{
  background:#16a34a;
  color:white;
  padding:16px 16px 20px;
}

.logo{
  margin-bottom:15px;
}

.brand-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.scooter{
  width:62px;
  height:62px;
  background:white;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  box-shadow:0 3px 10px #0003;
}

.brand{
  line-height:1;
}

.brand-name{
  font-size:31px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand-name .hindi{
  color:white;
}

.brand-name .english{
  color:#eaffef;
}

.delivery{
  font-size:20px;
  font-weight:800;
  color:#ffd43b;
  margin-top:5px;
}

.tagline{
  margin-left:74px;
  margin-top:7px;
  line-height:1.4;
}

.tagline-hindi{
  display:block;
  font-size:16px;
  font-weight:800;
}

.tagline-english{
  display:block;
  font-size:13px;
  font-weight:700;
}

/* SEARCH */
.search{
  background:white;
  border-radius:14px;
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:9px;
}

.search input{
  border:none;
  outline:none;
  width:100%;
  font-size:16px;
}

/* MAIN */
.container{
  max-width:750px;
  margin:auto;
  padding:15px;
}

/* FAST DELIVERY */
.fast-box{
  background:white;
  padding:17px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0000000b;
  font-size:16px;
  line-height:1.5;
}

.fast-title{
  color:#16a34a;
  font-weight:800;
  font-size:19px;
}

/* CATEGORIES */
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:5px 0 15px;
}

.categories button{
  border:1px solid #ddd;
  background:white;
  padding:11px 16px;
  border-radius:22px;
  white-space:nowrap;
  font-size:15px;
}

.categories button.active{
  background:#16a34a;
  color:white;
  border-color:#16a34a;
}

/* PRODUCTS */
.heading{
  font-size:23px;
  margin:7px 0 15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.product{
  background:white;
  border-radius:17px;
  padding:12px;
  box-shadow:0 2px 10px #0000000d;
}

.product-image{
  height:125px;
  background:#eff7f1;
  border-radius:13px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:58px;
  margin-bottom:11px;
}

.product h3{
  font-size:16px;
  line-height:1.3;
  min-height:41px;
}

.product small{
  color:#777;
}

.price{
  font-size:19px;
  font-weight:bold;
  margin:8px 0;
}

.add-btn{
  width:100%;
  padding:10px;
  border:1.5px solid #16a34a;
  background:white;
  color:#16a34a;
  border-radius:10px;
  font-weight:bold;
  font-size:15px;
}

.add-btn:active{
  background:#16a34a;
  color:white;
}

/* CART BAR */
.cart-bar{
  position:fixed;
  display:none;
  left:14px;
  right:14px;
  bottom:15px;
  max-width:700px;
  margin:auto;
  background:#17231d;
  color:white;
  padding:13px 16px;
  border-radius:15px;
  align-items:center;
  justify-content:space-between;
  z-index:100;
  box-shadow:0 4px 20px #0005;
}

.cart-button{
  background:#16a34a;
  color:white;
  border:none;
  padding:11px 16px;
  border-radius:9px;
  font-weight:bold;
}

/* MODAL */
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:200;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:520px;
  max-height:92vh;
  overflow:auto;
  margin:auto;
  border-radius:18px;
  padding:20px;
}

.close{
  float:right;
  width:35px;
  height:35px;
  border:none;
  border-radius:50%;
  background:#eee;
  font-size:23px;
}

.cart-title{
  font-size:23px;
  margin-bottom:15px;
}

.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.qty button{
  width:31px;
  height:31px;
  border:none;
  border-radius:7px;
  background:#e8f5ec;
  font-size:18px;
}

.summary{
  padding-top:15px;
  line-height:29px;
  font-size:16px;
}

.total{
  font-size:20px;
  font-weight:bold;
}

/* FORM */
.form-title{
  margin-top:20px;
  margin-bottom:5px;
}

.form input,
.form textarea{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.place-order{
  width:100%;
  padding:14px;
  margin-top:16px;
  border:none;
  background:#16a34a;
  color:white;
  border-radius:11px;
  font-size:17px;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:30px;
  color:#777;
}

/* DESKTOP */
@media(min-width:600px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>

  <div class="logo">

    <div class="brand-row">

      <div class="scooter">
        🛵
      </div>

      <div class="brand">

        <div class="brand-name">
          <span class="hindi">दूत</span>
          <span class="english">Doot</span>
        </div>

        <div class="delivery">
          Delivery
        </div>

      </div>

    </div>

    <div class="tagline">
      <span class="tagline-hindi">
        दूत आपके दरवाजे तक
      </span>

      <span class="tagline-english">
        Doot at Your Doorstep
      </span>
    </div>

  </div>

  <div class="search">
    🔍
    <input
      id="searchInput"
      type="text"
      placeholder="Search groceries, snacks, drinks..."
      oninput="renderProducts()"
    >
  </div>

</header>


<!-- MAIN -->
<div class="container">

  <div class="fast-box">
    📍
    <span class="fast-title">
      Fast Delivery
    </span>

    <br>

    Order now and get your products delivered locally
    in <b>10–30 minutes.</b>
  </div>


  <!-- CATEGORY -->
  <div class="categories">

    <button
      class="active"
      onclick="setCategory('All',this)"
    >
      All
    </button>

    <button
      onclick="setCategory('Grocery',this)"
    >
      🛒 Grocery
    </button>

    <button
      onclick="setCategory('Snacks',this)"
    >
      🍪 Snacks
    </button>

    <button
      onclick="setCategory('Drinks',this)"
    >
      🥤 Drinks
    </button>

    <button
      onclick="setCategory('Home',this)"
    >
      🏠 Home
    </button>

  </div>


  <h2 class="heading">
    Popular Products
  </h2>

  <div
    id="products"
    class="products"
  ></div>

</div>


<!-- CART BAR -->
<div
  id="cartBar"
  class="cart-bar"
>

  <div>
    🛒
    <span id="cartCount">
      0
    </span>
    items

    <br>

    <b>
      ₹<span id="cartTotal">0</span>
    </b>
  </div>

  <button
    class="cart-button"
    onclick="openCart()"
  >
    View Cart →
  </button>

</div>


<!-- CART MODAL -->
<div
  id="cartModal"
  class="modal"
>

  <div class="modal-box">

    <button
      class="close"
      onclick="closeCart()"
    >
      ×
    </button>

    <h2 class="cart-title">
      🛒 Your Cart
    </h2>

    <div id="cartItems"></div>

    <div
      id="summary"
      class="summary"
    ></div>


    <!-- CUSTOMER DETAILS -->

    <h3 class="form-title">
      Delivery Details
    </h3>

    <div class="form">

      <input
        id="customerName"
        type="text"
        placeholder="Your Name"
      >

      <input
        id="customerPhone"
        type="tel"
        placeholder="Mobile Number"
      >

      <textarea
        id="customerAddress"
        rows="4"
        placeholder="Complete Delivery Address"
      ></textarea>

    </div>


    <button
      class="place-order"
      onclick="placeOrder()"
    >
      🛵 Place Order on WhatsApp
    </button>

  </div>

</div>


<script>

/* PRODUCTS */

const products = [

  {
    id:1,
    name:"Aashirvaad Atta 5kg",
    price:285,
    category:"Grocery",
    image:"🌾"
  },

  {
    id:2,
    name:"Tata Salt 1kg",
    price:28,
    category:"Grocery",
    image:"🧂"
  },

  {
    id:3,
    name:"Fortune Sunflower Oil 1L",
    price:145,
    category:"Grocery",
    image:"🫗"
  },

  {
    id:4,
    name:"Maggi Noodles 280g",
    price:65,
    category:"Snacks",
    image:"🍜"
  },

  {
    id:5,
    name:"Parle-G Biscuits",
    price:20,
    category:"Snacks",
    image:"🍪"
  },

  {
    id:6,
    name:"Lays Potato Chips",
    price:20,
    category:"Snacks",
    image:"🥔"
  },

  {
    id:7,
    name:"Coca-Cola 750ml",
    price:45,
    category:"Drinks",
    image:"🥤"
  },

  {
    id:8,
    name:"Amul Taaza Milk 1L",
    price:68,
    category:"Drinks",
    image:"🥛"
  },

  {
    id:9,
    name:"Bisleri Water 1L",
    price:20,
    category:"Drinks",
    image:"💧"
  },

  {
    id:10,
    name:"Surf Excel 1kg",
    price:145,
    category:"Home",
    image:"🧺"
  },

  {
    id:11,
    name:"Vim Dishwash Bar",
    price:20,
    category:"Home",
    image:"🧽"
  },

  {
    id:12,
    name:"Dettol Handwash",
    price:99,
    category:"Home",
    image:"🧴"
  }

];


let cart = [];

let currentCategory = "All";


/* CATEGORY */

function setCategory(category,button){

  currentCategory = category;

  document
    .querySelectorAll(".categories button")
    .forEach(function(btn){
      btn.classList.remove("active");
    });

  button.classList.add("active");

  renderProducts();

}


/* SHOW PRODUCTS */

function renderProducts(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  const box =
    document.getElementById("products");


  const filtered =
    products.filter(function(product){

      const categoryMatch =
        currentCategory === "All" ||
        product.category === currentCategory;

      const searchMatch =
        product.name
          .toLowerCase()
          .includes(search);

      return categoryMatch && searchMatch;

    });


  if(filtered.length === 0){

    box.innerHTML =
      '<div class="empty">No products found.</div>';

    return;

  }


  box.innerHTML =
    filtered.map(function(product){

      return `

        <div class="product">

          <<div class="product-image">
  ${
    product.imageUrl
      ? `<img src="${product.imageUrl}"
             style="width:100%;height:100%;object-fit:contain;border-radius:13px;">`
      : product.image
  }
</div>

          <h3>
            ${product.name}
          </h3>

          <small>
            ⚡ Fast delivery
          </small>

          <div class="price">
            ₹${product.price}
          </div>

          <button
            class="add-btn"
            onclick="addToCart(${product.id})"
          >
            + Add
          </button>

        </div>

      `;

    }).join("");

}


/* ADD TO CART */

function addToCart(id){

  const existing =
    cart.find(function(item){
      return item.id === id;
    });


  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      id:id,
      quantity:1
    });

  }


  updateCart();

}


/* CHANGE QUANTITY */

function changeQuantity(id,change){

  const item =
    cart.find(function(item){
      return item.id === id;
    });


  if(!item){
    return;
  }


  item.quantity += change;


  if(item.quantity <= 0){

    cart =
      cart.filter(function(item){
        return item.id !== id;
      });

  }


  updateCart();

  renderCart();

}


/* CART TOTAL */

function getSubtotal(){

  return cart.reduce(function(total,item){

    const product =
      products.find(function(p){
        return p.id === item.id;
      });

    return total +
      product.price * item.quantity;

  },0);

}


/* UPDATE CART */

function updateCart(){

  const count =
    cart.reduce(function(total,item){
      return total + item.quantity;
    },0);


  const subtotal =
    getSubtotal();


  document
    .getElementById("cartCount")
    .innerText = count;


  document
    .getElementById("cartTotal")
    .innerText = subtotal;


  document
    .getElementById("cartBar")
    .style.display =
      count > 0 ? "flex" : "none";

}


/* OPEN CART */

function openCart(){

  document
    .getElementById("cartModal")
    .style.display = "flex";

  renderCart();

}


/* CLOSE CART */

function closeCart(){

  document
    .getElementById("cartModal")
    .style.display = "none";

}


/* RENDER CART */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  if(cart.length === 0){

    box.innerHTML =
      '<div class="empty">Your cart is empty.</div>';

    document
      .getElementById("summary")
      .innerHTML = "";

    return;

  }


  box.innerHTML =
    cart.map(function(item){

      const product =
        products.find(function(p){
          return p.id === item.id;
        });


      return `

        <div class="cart-item">

          <div>

            <b>
              ${product.image}
              ${product.name}
            </b>

            <br>

            ₹${product.price}
            ×
            ${item.quantity}

          </div>


          <div class="qty">

            <button
              onclick="changeQuantity(${product.id},-1)"
            >
              −
            </button>

            ${item.quantity}

            <button
              onclick="changeQuantity(${product.id},1)"
            >
              +
            </button>

          </div>

        </div>

      `;

    }).join("");


  const subtotal =
    getSubtotal();


  const deliveryCharge =
    subtotal >= 299 ? 0 : 20;


  const grandTotal =
    subtotal + deliveryCharge;


  document
    .getElementById("summary")
    .innerHTML = `

      <div>
        Subtotal:
        <b>₹${subtotal}</b>
      </div>

      <div>
        Delivery:
        <b>
          ${
            deliveryCharge === 0
            ? "FREE"
            : "₹20"
          }
        </b>
      </div>

      <hr>

      <div class="total">
        Total:
        ₹${grandTotal}
      </div>

    `;

}


/* PLACE ORDER */

function placeOrder(){

  if(cart.length === 0){

    alert(
      "Please add products to your cart first."
    );

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  if(!name || !phone || !address){

    alert(
      "Please enter your name, mobile number and complete address."
    );

    return;

  }


  let message =
    "🛵 *DOOT DELIVERY ORDER*%0A";

  message +=
    "%0A👤 Name: " +
    encodeURIComponent(name);

  message +=
    "%0A📱 Mobile: " +
    encodeURIComponent(phone);

  message +=
    "%0A📍 Address: " +
    encodeURIComponent(address);

  message +=
    "%0A%0A🛒 *ORDER DETAILS*%0A";


  cart.forEach(function(item){

    const product =
      products.find(function(p){
        return p.id === item.id;
      });


    const itemTotal =
      product.price * item.quantity;


    message +=
      encodeURIComponent(product.name) +
      " × " +
      item.quantity +
      " = ₹" +
      itemTotal +
      "%0A";

  });


  const subtotal =
    getSubtotal();


  const deliveryCharge =
    subtotal >= 299 ? 0 : 20;


  const grandTotal =
    subtotal + deliveryCharge;


  message +=
    "%0A💰 Subtotal: ₹" +
    subtotal;

  message +=
    "%0A🚚 Delivery: " +
    (
      deliveryCharge === 0
      ? "FREE"
      : "₹20"
    );

  message +=
    "%0A💵 *TOTAL: ₹" +
    grandTotal +
    "*";


  /*
    DOOT DELIVERY WHATSAPP NUMBER
    9678274671
  */

  const whatsappNumber =
    "919678274671";


  const whatsappURL =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    message;


  window.open(
    whatsappURL,
    "_blank"
  );

}


/* START WEBSITE */

renderProducts();

updateCart();

</script>

</body>
      </html>
