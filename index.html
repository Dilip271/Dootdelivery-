<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#159653">
<title>DootDelivery - Fast Local Delivery</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7faf8;
  color:#17231d;
}
header{
  background:white;
  padding:16px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #e5ebe7;
  position:sticky;
  top:0;
  z-index:10;
}
.logo{
  font-size:30px;
  font-weight:800;
}
.logo span{color:#159653}
.cart-btn{
  border:1px solid #d8e1dc;
  background:white;
  padding:12px 18px;
  border-radius:14px;
  font-size:16px;
  cursor:pointer;
}
.hero{
  padding:55px 5% 35px;
  max-width:1100px;
  margin:auto;
}
.badge{
  color:#159653;
  font-weight:bold;
  letter-spacing:1px;
}
h1{
  font-size:52px;
  line-height:1.05;
  margin:18px 0;
}
.green{color:#159653}
.hero p{
  font-size:20px;
  color:#69756e;
  line-height:1.6;
}
.search{
  display:flex;
  max-width:700px;
  margin-top:25px;
}
.search input{
  flex:1;
  padding:17px;
  border:1px solid #d7e0db;
  border-radius:14px 0 0 14px;
  font-size:17px;
}
.search button{
  padding:17px 25px;
  border:0;
  background:#159653;
  color:white;
  font-weight:bold;
  border-radius:0 14px 14px 0;
}
.features{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
  margin-top:20px;
  color:#56645c;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px 5% 60px;
}
h2{font-size:30px}
.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:15px;
}
.categories button{
  white-space:nowrap;
  padding:11px 17px;
  border:1px solid #d8e1dc;
  background:white;
  border-radius:25px;
  cursor:pointer;
}
.categories button.active{
  background:#159653;
  color:white;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  gap:18px;
}
.card{
  background:white;
  border:1px solid #e3e9e5;
  border-radius:18px;
  padding:15px;
  box-shadow:0 4px 15px #00000008;
}
.pic{
  height:150px;
  background:#edf8f1;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
}
.card h3{margin:14px 0 5px}
.price{
  font-size:20px;
  font-weight:bold;
  color:#159653;
}
.add{
  width:100%;
  margin-top:12px;
  padding:12px;
  border:0;
  background:#159653;
  color:white;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}
.delivery{
  margin-top:40px;
  background:#e8f8ee;
  padding:30px;
  border-radius:22px;
  text-align:center;
}
footer{
  background:#17231d;
  color:white;
  padding:30px 5%;
  text-align:center;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:85vh;
  overflow:auto;
  border-radius:20px;
  padding:22px;
}
.close{
  float:right;
  border:0;
  background:#eee;
  border-radius:50%;
  width:35px;
  height:35px;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.checkout{

  margin-top:15px;
